name: Demo checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  data-and-scorers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cmudict==1.1.3 rich==15.0.0 jinja2==3.1.6
      - run: python -m compileall -q haiku claudish ollama prepare_models.py
      - name: Haiku data and scorer checks
        working-directory: haiku
        run: |
          python make_data.py
          python -m unittest -v
      - name: Fresh-context template checks
        working-directory: ollama
        run: python -m unittest -v
      - name: Claudish data and scorer checks
        working-directory: claudish
        run: |
          python make_data.py
          python -m unittest -v
      - name: Claudish 4B template regression checks
        working-directory: claudish/v2
        run: python -m unittest -v
